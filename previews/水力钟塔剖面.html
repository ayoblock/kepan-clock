<footer>
名例：正名「授时楼」，额「挈壶」，俗称「水钟楼」；「塔」为浮屠旧称，不入官牒。<br>
水路：池水由翻车提至水柜，恒位壶以浮子阀维持水位，擒纵放行时开阀注一斗，满则复闭；余水沿回管落池。<br>
枢轮二十四斗，一刻一斗，一日九十六刻，故一日四转；晷针一日一转，齿比四比一。
