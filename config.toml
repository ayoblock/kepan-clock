# 刻盘钟 配置
# 安装后可复制到 ~/.config/kepan-clock/config.toml 覆盖默认值。

[place]
# 更点与昼夜切换所依的地理位。纬度缺失时更点不可信，牌窗标「更点缺」。
latitude = 39.9
longitude = 116.4

[dusk]
# 昏旦偏移（分钟）：昏＝日落加此数，旦＝日出减此数。约古二刻半。
offset_minutes = 37

[mode]
# 昼夜主题：auto 随日出日落 / day 锁昼盘 / night 锁夜盘
theme = "auto"

[sound]
# 报时声（辰初钟三下、辰正鼓二下、每刻鼓一声）。默认关；开启须有 paplay。
# 节律：每刻一声（每十五分钟）；辰初（每两小时）钟三下；辰正鼓二下。
# debug = true 时每次触发打一行到终端（从终端启动方可见）。
enabled = false
debug = false

[panel]
# 右列背景水印：zodiac 当前时辰生肖剪影（随辰换兽）/ feitian 当前时辰飞天
# 剪影（随辰换姿，占满更牌窗之下区域）/ beast 四神兽 / chen 辰字大篆 / none 无。
# watermark_alpha：水印不透明度 0.02–0.45，默认 0.16。
watermark = "zodiac"
watermark_alpha = 0.16

[fonts]
# 辰字与读数：楷体为主，明体兜底
chen = "AR PL UKai CN, AR PL UMing CN, Noto Serif CJK SC, serif"
# 款识与生肖：篆书。游龙篆书居首；霞鹜篆书（LXGW Seal，开源）为兜底。
seal = "zihunyoulongzhuanshu_trial, 字魂游龙篆书(商用需授权), 霞鹜篆书, LXGW Seal, Aa美人篆（简繁）, AR PL UKai CN, serif"
